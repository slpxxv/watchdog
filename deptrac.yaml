deptrac:
  paths:
    - ./src
    - ./app
  layers:
    # src/ is the domain: plain PHP, no framework.
    - name: Domain
      collectors:
        - type: directory
          value: src/\w+/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/\w+/Application/.*
    # app/ is the Symfony application: controllers, Doctrine, security, messaging.
    - name: App
      collectors:
        - type: directory
          value: app/.*
    # The one library the domain may use: to-many associations need a Collection.
    - name: Collections
      collectors:
        - type: classLike
          value: ^Doctrine\\Common\\Collections\\.*
    - name: Framework
      collectors:
        - type: classLike
          value: ^(Symfony|Twig|Doctrine\\(?!Common\\Collections\\))\\?.*
    - name: Psr
      collectors:
        - type: classLike
          value: ^Psr\\.*
  ruleset:
    Domain: [Collections]
    Application: [Domain, Collections, Psr]
    App: [Domain, Application, Collections, Framework, Psr]
