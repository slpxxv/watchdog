security:
    password_hashers:
        Watchdog\Identity\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        app_users:
            id: Watchdog\Identity\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        # Log shippers: a source token on every request, no session, no cookies.
        ingest:
            pattern: ^/api/v1/ingest/
            stateless: true
            access_token:
                token_handler: Watchdog\Logging\Infrastructure\Security\SourceTokenHandler
        main:
            lazy: true
            provider: app_users
            # Session cookie auth for the server-rendered pages. The login form and logout carry a CSRF token.
            form_login:
                login_path: identity_login
                check_path: identity_login
                enable_csrf: true
                default_target_path: home
            logout:
                path: identity_logout
                target: identity_login
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/api/v1/ingest/, roles: ROLE_INGEST }
        - { path: ^/(login$|assets/), roles: PUBLIC_ACCESS }
        - { path: ^/(_profiler|_wdt|_error), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Watchdog\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
