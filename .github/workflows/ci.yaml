name: CI

# One workflow, one required check ("CI OK"). Pull requests run only the parts
# their changes touch; master, the weekly run and manual runs do everything.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC: catches new advisories without code changes
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=17&charset=utf8
  REDIS_URL: redis://127.0.0.1:6379
  MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On pull_request the checkout is the merge commit; HEAD^1 is the base branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: '^(src|tests|config|migrations|bin|public|templates|translations|assets)/|^(composer\.(json|lock)|symfony\.lock|importmap\.php|\.env.*|phpunit\.dist\.xml|phpstan\.dist\.neon|deptrac.*\.yaml|\.php-cs-fixer\.dist\.php|compose.*\.yaml)$|^\.github/(workflows/ci\.yaml|actions/)'
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$files"
          if grep -qE "$BACKEND" <<<"$files"; then echo "backend=true"; else echo "backend=false"; fi | tee -a "$GITHUB_OUTPUT"

  backend-static:
    name: Backend (lint, PHPStan, Deptrac)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: composer validate --strict
      - uses: ./.github/actions/setup-backend
      - run: composer audit
      - run: composer qa:static

  backend-tests:
    name: Backend (PHPUnit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Test database
        run: |
          bin/console doctrine:database:create --env=test --if-not-exists
          bin/console doctrine:migrations:migrate --env=test --no-interaction
          bin/console doctrine:schema:validate --env=test
      - run: composer qa:tests

  ci-ok:
    name: CI OK
    needs: [changes, backend-static, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped jobs are fine (nothing to check); failed or cancelled ones are not.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
