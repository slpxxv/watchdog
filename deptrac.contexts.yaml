deptrac:
    paths:
        - ./src
        - ./app
    layers:
        - name: Identity
          collectors:
              - type: directory
                value: src/Identity/(?!Application/(Query|Dto)/).*
              - type: directory
                value: app/(\w+/Identity/.*|Http/LogoutListener\.php|Command/CreateUserCommand\.php)
        - name: IdentityApi
          collectors:
              - type: directory
                value: src/Identity/Application/(Query|Dto)/.*
        - name: Project
          collectors:
              - type: directory
                value: src/Project/(?!Application/(Query|Dto|Event)/).*
              - type: directory
                value: app/\w+/Project/.*
        - name: ProjectApi
          collectors:
              - type: directory
                value: src/Project/Application/(Query|Dto|Event)/.*
        - name: Logging
          collectors:
              - type: directory
                value: src/Logging/.*
              - type: directory
                value: app/(\w+/Logging/.*|Command/Log\w+Command\.php)
        - name: Shared
          collectors:
              - type: directory
                value: src/Shared/.*
              - type: directory
                value: app/(Http/(?!LogoutListener).*|Kernel\.php|Messaging/Schedule\.php)
    ruleset:
        Identity: [Shared, IdentityApi]
        IdentityApi: [Identity, Shared]
        Project: [Shared, ProjectApi]
        ProjectApi: [Project, Shared]
        Logging: [Shared, ProjectApi]
        Shared: []
